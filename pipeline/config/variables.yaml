# The 15-variable catalogue (docs/variables.md), checked against NASA CMR on 2026-10-26.
# tier 1 = ships by 15 Nov; tier 2 = if on schedule; tier 3 = catalogue-only ("trend pending" in the UI).
# expected_granules overrides the monthly count for products that are one file or daily (see scripts/check_datasets.py).
window:
  start: "2003-01"
  end: "2025-12"
grid_deg: 0.5
fdr_alpha: 0.10
min_years: 10
seasons: [ANN, DJF, MAM, JJA, SON]

variables:
  # ---------- Tier 1 ----------
  ndvi:
    tier: 1
    sphere: land
    label: Vegetation greenness (NDVI)
    product: MOD13C2
    version: "061"
    daac: LPCLOUD
    var: CMG 0.05 Deg Monthly NDVI
    units: "1"
    trend_units: "NDVI/decade"
    regrid: coarsen_10
    mask: ndvi_mean_below_0.1
    relative: false
    palette: wet
    validation: Chen et al. 2019, Nature Sustainability, Fig. 1 (China and India greening)
  tws:
    tier: 1
    sphere: hydrology
    label: Total water storage (GRACE)
    product: TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4
    version: RL06.3Mv04
    daac: POCLOUD
    var: lwe_thickness
    units: cm
    trend_units: "cm/decade"
    regrid: none
    mask: land
    relative: false
    palette: wet
    expected_granules: 1
    validation: Rodell et al. 2018, Nature, Fig. 1 (34 hotspot regions)
    note: One file with all months; gap 2017-07 to 2018-05. Native resolution about 3 degrees despite the 0.5 degree grid.
  aod:
    tier: 1
    sphere: atmosphere
    label: Haze (aerosol optical depth)
    product: M2TMNXAER
    version: "5.12.4"
    daac: GES_DISC
    var: TOTEXTTAU
    units: "1"
    trend_units: "AOD/decade"
    regrid: bilinear
    mask: none
    relative: true
    palette: haze
    subset: opendap
    validation: de Meij et al. 2012; Gupta et al. 2022 (Europe/N America down, South Asia up)
    note: >-
      MERRA-2 reanalysis total aerosol extinction at 550 nm (it assimilates MODIS AOD), chosen over
      MODIS MYD08_M3 whose full record is ~102 GB. Model output: say so in the app. China rose until
      about 2008 then fell; a single 2003-2025 slope flattens it.
  t2m:
    tier: 1
    sphere: atmosphere
    label: Air temperature (GISTEMP)
    note: "Measured by thermometers on land and ships/buoys at sea, on a 2° grid, so the map is smoother than the others. Replaced MERRA-2, a model that warms ~25% more slowly (0.21 vs 0.28 °C/decade)."
    product: GISTEMP v4 (GHCNv4 + ERSSTv5, 1200 km)
    daac: NASA GISS
    url: https://data.giss.nasa.gov/pub/gistemp/gistemp1200_GHCNv4_ERSSTv5.nc.gz
    var: tempanomaly
    units: "°C"
    trend_units: "°C/decade"
    regrid: bilinear_2deg
    mask: none
    relative: false
    palette: warm
    validation: NASA GISTEMP v4 global mean trend
  precip:
    tier: 1
    sphere: hydrology
    label: Precipitation
    product: GPM_3IMERGM
    version: "07"
    daac: GES_DISC
    var: precipitation
    units: mm/hr
    trend_units: "mm/day per decade"
    regrid: coarsen_5
    mask: none
    relative: true
    min_climatology_mm_day: 0.1
    palette: wet
    expected_granules: 273
    validation: GPCP v2.3 (no firm pixel-level target found)
    note: Final V07 ends 2025-09. Expect few significant cells; that is the honest "is it significant?" lesson.

  # ---------- Tier 2 ----------
  lst:
    tier: 2
    sphere: land
    label: Land surface temperature (night)
    product: MYD11C3
    version: "061"
    daac: LPCLOUD
    var: LST_Night_CMG
    units: K
    trend_units: "°C/decade"
    regrid: coarsen_10
    mask: land
    palette: warm
    note: "Aqua night overpass (about 1:30 am), which barely feels orbit drift because the ground cools slowly at night. The daytime field dropped: drift made 2025 look up to 1.2 K too cold in the tropics. Night trends track GISTEMP over land (+0.40 vs +0.38 K/decade)."
  snow:
    tier: 2
    sphere: cryosphere
    label: Snow cover
    product: MOD10CM
    version: "61"
    daac: NSIDC_CPRD
    var: Snow_Cover_Monthly_CMG
    units: "%"
    trend_units: "%/decade"
    regrid: coarsen_10
    mask: land
    palette: wet
    expected_granules: 273
  soil:
    tier: 2
    sphere: hydrology
    label: Soil moisture and evapotranspiration (GLDAS)
    caution: "Model data. The map only colours places where two independent models (GLDAS and MERRA-2) agree on wetter or drier; elsewhere it is left blank. Site trends use GLDAS alone: Mediterranean and Amazon drying appear in both models, the global, Sahel and southern Africa drying do not."
    product: GLDAS_NOAH025_M
    version: "2.1"
    daac: GES_DISC
    var: SoilMoi0_10cm_inst
    units: kg/m2
    trend_units: "kg/m2 per decade"
    regrid: coarsen_2
    mask: land
    palette: wet
    note: Replaces MERRA-2 GWETTOP. Also carries Evap_tavg for evapotranspiration.
  seaice:
    tier: 2
    sphere: cryosphere
    label: Sea ice concentration
    product: NSIDC-0051
    version: "2"
    daac: NSIDC_CPRD
    var: sea ice concentration
    units: "%"
    trend_units: "%/decade"
    regrid: polar_stereo_to_latlon
    mask: ocean
    palette: wet
    expected_granules: 17354
    note: Daily + monthly mixed in CMR; use monthly files only. Polar grid needs regridding.
  sst:
    tier: 2
    sphere: ocean
    label: Sea surface temperature
    product: MODIS_AQUA_L3_SST_THERMAL_MONTHLY_9KM_DAYTIME_V2019.0
    version: "2019.0"
    daac: POCLOUD
    var: sst
    units: degC
    trend_units: "°C/decade"
    regrid: coarsen_6
    mask: ocean
    palette: warm
    expected_granules: 276
    note: MODIS-Aqua monthly 9 km daytime SST (8 MB/month). Replaced MUR, whose daily 0.01 degree files are 332 MB each.

  # ---------- Tier 3 (catalogue only) ----------
  no2:
    tier: 3
    sphere: atmosphere
    label: Nitrogen dioxide (OMI)
    product: OMNO2d
    version: "003"
    daac: GES_DISC
    var: ColumnAmountNO2TropCloudScreened
    units: molecules/cm2
    expected_granules: 7726
    note: Starts 2004-10; daily, aggregate to monthly; OMI row anomaly after 2007.
  ozone:
    tier: 3
    sphere: atmosphere
    label: Total column ozone (MERRA-2)
    caution: "Near-global rise of +1.8 DU/decade is still above published records (roughly flat since 2000), likely because MERRA-2 also takes in OMI, whose sensor has degraded since 2007. Northern mid-latitudes are flat, as published. Treat tropical and global trends as uncertain."
    product: M2TMNXSLV
    version: "5.12.4"
    daac: GES_DISC
    var: TO3
    units: DU
    note: "Replaced OMI alone (OMTO3e), whose sensor fault made ozone rise twice as fast (+3.7 DU/decade). MERRA-2 combines OMI with the Aura MLS instrument and covers all of 2003-2025."
  airs:
    tier: 3
    sphere: atmosphere
    label: Stratospheric temperature, 10 hPa (AIRS)
    product: AIRS3STM
    version: "7.0"
    daac: GES_DISC
    var: Temperature_A
    units: K
    expected_granules: 277
    note: 10 hPa level of Temperature_A (ascending orbit). Shows CO2-driven stratospheric cooling, the opposite sign to surface warming.
  chlor:
    tier: 3
    sphere: ocean
    label: Ocean chlorophyll
    product: MODISA_L3m_CHL
    version: "2022.0"
    daac: OB_CLOUD
    var: chlor_a
    units: mg/m3
    expected_granules: 26198
    granule_name: "*L3m.MO.CHL.chlor_a.9km*"
    note: Mixed periods and resolutions in CMR; granule_name keeps the monthly 9 km files.
  sealevel:
    tier: 3
    sphere: ocean
    label: Sea level
    product: NASA_SSH_REF_SIMPLE_GRID_V1
    version: "1"
    daac: POCLOUD
    var: ssha
    units: m
    expected_granules: 1202
    note: About 5-day files; aggregate to monthly.

validation:
  sea_ice_september: https://noaadata.apps.nsidc.org/NOAA/G02135/north/monthly/data/N_09_extent_v4.0.csv
  gistemp_global: https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv
